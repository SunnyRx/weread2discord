name: weread2discord

on:
  # 定时触发已移至本机 OpenClaw 自动化（东京 09:00 调用 workflow_dispatch）。
  # 原因：GitHub Actions 自带的 schedule 属 UTC 且常被延迟数小时甚至丢单，
  # 无法保证在指定时间可靠运行。手动触发保持可用。
  workflow_dispatch:
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: weread2discord
        run: |
          python weread2discord.py "${{secrets.WEREAD_API_KEY}}" "${{secrets.DISCORD_WEBHOOK_URL}}"
